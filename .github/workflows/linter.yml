name: Lint

on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/lint-reports/**

permissions:
  contents: read

jobs:
  fix-lint-issues:
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove previous lint reports
        run: rm -rf .github/lint-reports
      - name: Super-Linter
        uses: super-linter/super-linter@v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SAVE_SUPER_LINTER_SUMMARY: true
          SAVE_SUPER_LINTER_OUTPUT: true
          DEFAULT_WORKSPACE: ${{ github.workspace }}
          SUPER_LINTER_OUTPUT_DIRECTORY_NAME: .github/lint-reports
          VALIDATE_JAVA: true
          FILTER_REGEX_INCLUDE: '.*src/.*\.java$' # look in all of src folder for java files
      - name: Persist lint reports
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: master
          file_pattern: .github/lint-reports/*
          commit_message: "ACTIONS CHORE: persist lint reports"